name: tooling (temporary)
on:
  push:
    branches: [tmp-tooling]
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: tar -czf nm.tgz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: nm
          path: nm.tgz
          retention-days: 1
