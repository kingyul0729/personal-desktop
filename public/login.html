<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>다채움 데스크톱 · 로그인</title>
<style>
@font-face{font-family:"PD Beomseok Neo";src:url("/fonts/beomseok-neo.woff2") format("woff2");font-display:swap}
:root{--bg:#eef0f3;--card:#fcfcfd;--line:#dce0e5;--ink:#172033;--mute:#81878f;--accent:#4f698c;--accent-soft:#748eb1;--err:#b4442b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PD Beomseok Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
body{background:#eef0f3;background-image:radial-gradient(#dfe3e9 1px,transparent 1px);background-size:22px 22px}
.wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 30px 28px;box-shadow:0 18px 40px rgba(23,32,51,.08)}
.mark{width:52px;height:52px;border-radius:14px;background:#e4e9f0;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.mark svg{width:28px;height:28px;color:var(--accent)}
h1{font-size:19px;font-weight:700;margin:0 0 6px;text-align:center;color:#444a52}
.sub{font-size:13px;color:var(--mute);text-align:center;margin:0 0 24px;line-height:1.5}
label{display:block;font-size:12.5px;color:#555f6b;font-weight:600;margin:14px 0 6px}
input{width:100%;height:48px;border:1px solid #cfd5dd;border-radius:11px;padding:0 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,105,140,.16)}
button{width:100%;height:50px;margin-top:22px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.err{min-height:18px;margin-top:12px;font-size:13px;color:var(--err);text-align:center}
.setup{background:#eef2f7;border:1px solid #d6dfea;color:#3f5574;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-bottom:4px}
.note{margin-top:16px;font-size:12px;color:var(--mute);text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="f" autocomplete="on">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></div>
    <h1 id="title">다채움 데스크톱</h1>
    <p class="sub">금액 계산 · 가격표 · 업무 자료실</p>
    <div class="setup" id="setup" hidden>처음 사용입니다. 관리자 계정을 먼저 만들어 주세요.</div>
    <label for="name">이름</label>
    <input id="name" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" required>
    <label for="pw">비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <div id="pw2wrap" hidden><label for="pw2">비밀번호 확인</label><input id="pw2" type="password" autocomplete="new-password"></div>
    <button id="btn" type="submit">로그인</button>
    <div class="err" id="err" role="alert"></div>
    <p class="note">동의서·환불정산 시스템과 같은 계정을 씁니다.</p>
  </form>
</div>
<script>
(function () {
  var f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn'), setupMode = false;
  var next = new URLSearchParams(location.search).get('next') || '/'; if (!/^\/(?!\/)/.test(next)) next = '/';
  fetch('/auth/state', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (j.user) return location.replace(next);
    if (j.needsSetup) { setupMode = true; document.getElementById('setup').hidden = false; document.getElementById('pw2wrap').hidden = false; document.getElementById('title').textContent = '관리자 계정 만들기'; btn.textContent = '만들고 시작'; }
  }).catch(function () {});
  f.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = '';
    var name = document.getElementById('name').value.trim(), pw = document.getElementById('pw').value;
    if (setupMode && pw !== document.getElementById('pw2').value) { err.textContent = '비밀번호 확인이 일치하지 않습니다'; return; }
    btn.disabled = true;
    fetch(setupMode ? '/auth/setup' : '/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: name, password: pw }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { if (!x.ok) { err.textContent = (x.j && x.j.error) || '로그인에 실패했습니다'; btn.disabled = false; return; } location.replace(next); })
      .catch(function () { err.textContent = '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요'; btn.disabled = false; });
  });
})();
</script>
</body>
</html>
