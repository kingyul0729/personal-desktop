# dauril.com 배포용 (Cloudflare Workers Builds). 원래 OpenAI 호스팅용 빌드(npm run build)와는 별개.
# 빌드 명령: npm run build:cf   배포 명령: npx wrangler deploy
name = "personal-desktop"
main = "cloudflare/worker.js"
compatibility_date = "2025-10-01"

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true      # 모든 요청을 Worker가 먼저 받아 로그인 확인
not_found_handling = "none"
html_handling = "none"

# 동의서·환불정산 시스템과 같은 D1 → 같은 직원 계정으로 로그인
[[d1_databases]]
binding = "DB"
database_name = "dauril-consent"
database_id = "f1b8e866-d05a-4d78-9873-5ace007aa152"

# 예전 재고관리 앱 D1 — 직원 스케줄·연차·성과 원본(worker/staff.js). 주문·결제 표는 쓰지 않음.
[[d1_databases]]
binding = "INV_DB"
database_name = "webapp-production"
database_id = "ec4ff5ee-5e57-4628-91c1-a5c2a9dc172d"

# 파일(가격표·첨부 이미지) 저장: R2를 켜면 아래 주석을 풀어 연결. 없으면 D1에 저장됨.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "dauril-files"

[observability]
enabled = true
